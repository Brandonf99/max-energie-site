<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Médias - Max Énergie</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .media-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
    margin-top:28px;
  }
  @media (max-width:760px){ .media-grid{ grid-template-columns:1fr 1fr; } }
  @media (max-width:480px){ .media-grid{ grid-template-columns:1fr; } }
  .media-grid img{
    width:100%;
    height:100%;
    aspect-ratio:4/3;
    object-fit:cover;
    border-radius:var(--radius);
    border:1px solid var(--line);
    display:block;
  }
  .media-state{
    border:1.5px dashed var(--line);
    border-radius:var(--radius);
    background:#FFF6EF;
    padding:24px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
    margin-top:28px;
  }
</style>
</head>
<body>

<header class="site">
  <div class="nav-inner">
    <a href="index.html" class="brand"><span class="dot"></span>Max Énergie</a>
    <button class="menu-toggle" aria-label="Menu" onclick="document.querySelector('nav.links').classList.toggle('open')">Menu</button>
    <nav class="links">
      <a href="index.html">Accueil</a>
      <a href="info.html">Information</a>
      <a href="inscription-max-energie.html">Inscription</a>
      <a href="horaire.html">Horaire</a>
      <a href="https://xpressobaravetements.com/collections/max-energie" target="_blank" rel="noopener">Boutique</a>
      <a href="medias.html" class="active">M&eacute;dias</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<section class="hero" style="padding-bottom:10px;">
  <div class="container">
    <p class="eyebrow">En photos et vidéos</p>
    <h1>Médias</h1>
    <p class="sub">Un aperçu de l'ambiance Max Énergie — cours, événements et moments d'équipe.</p>
  </div>
</section>

<section class="section" style="padding-top:10px;">
  <div class="container">
    <div class="media-grid" id="mediaGrid"></div>
    <div class="media-state" id="mediaState">Chargement des photos...</div>
  </div>
</section>

<script>
/* =========================================================================
   CONFIG
   ========================================================================= */
const GITHUB_USER   = "brandonf99";
const GITHUB_REPO   = "max-energie-site";
const GITHUB_BRANCH = "main";
const MEDIA_PATH    = "images/medias"; // <-- drop photos in this folder on GitHub
/* ========================================================================= */

const IMAGE_EXT = /\.(jpe?g|png|webp|gif)$/i;

async function loadMedia() {
  const grid = document.getElementById('mediaGrid');
  const state = document.getElementById('mediaState');

  const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${MEDIA_PATH}?ref=${GITHUB_BRANCH}`;

  try {
    const res = await fetch(apiUrl);
    if (!res.ok) throw new Error('fetch-failed');
    const items = await res.json();

    const images = items.filter(item => item.type === 'file' && IMAGE_EXT.test(item.name));

    if (images.length === 0) {
      state.textContent = "Aucune photo pour l'instant — revenez bientôt !";
      return;
    }

    grid.innerHTML = images.map(img => {
      const label = img.name.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');
      return `<img src="${img.download_url}" alt="Max Énergie — ${label}" loading="lazy">`;
    }).join('');

    state.style.display = 'none';
  } catch (err) {
    state.textContent = "Impossible de charger les photos pour le moment. Réessayez plus tard.";
  }
}

loadMedia();
</script>

<footer class="site">
  <div class="container footer-inner">
    <a href="index.html" class="brand"><span class="dot"></span>Max Énergie</a>
    <div class="footer-links">
      <a href="info.html">Information</a>
      <a href="horaire.html">Horaire</a>
      <a href="contact.html">Contact</a>
      <a href="inscription-max-energie.html">Inscription</a>
    </div>
    <span>&copy; <span id="year"></span> Max Énergie · Gatineau, QC</span>
  </div>
</footer>

<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
